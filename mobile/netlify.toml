[build]
  base = "mobile/"
  publish = "build/web"
  command = """
    flutter config --enable-web && \
    flutter pub get && \
    flutter build web --release --dart-define=API_BASE_URL=${API_BASE_URL:-http://localhost:8000/api/v1/}
  """

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  FLUTTER_VERSION = "3.16.0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
